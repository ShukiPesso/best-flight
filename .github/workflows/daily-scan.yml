name: Daily flight scan

on:
  schedule:
    - cron: "30 3 * * *"   # every day 05:30/06:30 Israel time
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
        run: python -m flightscan.scan
      - name: Commit results
        run: |
          git config user.name "flight-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/deals.json
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
