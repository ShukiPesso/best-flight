# הגדרות סורק הטיסות
# ------------------------------------------------------------
# יעדים: קודי IATA של שדות תעופה. חייבים להופיע בטבלה ב-flightscan/airports.py
# (אפשר להוסיף שם שדה חדש: שם, עיר, קו רוחב/אורך ואזור זמן).
destinations: [CDG]   # פריז, שארל דה גול בלבד

# שדות מוצא בישראל
origins: [TLV, ETM]
# האם לאפשר טיסת הלוך מנתב"ג וחזור לרמון (או להפך)
allow_mixed_israeli_airports: false

# טווח תאריכי היציאה (ההלוך). החזור יכול להיות גם אחרי סוף הטווח.
search_window:
  # אפשרות א: תאריכים קבועים. כשממלאים אותם (למשל from: 2027-05-01 ו-to: 2027-05-31), הם קובעים
  from:
  to:
  # אפשרות ב (פעילה): חלון מתגלגל בחודשים. יציאה בין עוד 6 חודשים לעוד 7 חודשים,
  # ומתעדכן כל יום (היום 26.11 -> יציאות 26.5 עד 26.6)
  start_after_months: 6
  length_months: 1
  # אפשרות ג: חלון מתגלגל בימים (משמש אם מוחקים את start_after_months)
  start_after_days: 90
  length_days: 90

# אורך הטיול בימים (כולל יום ההלוך ויום החזור: יציאה בראשון וחזרה בחמישי = 5 ימים)
trip_days:
  min: 3
  max: 4
  # הצעות מחוץ לטווח (עד הגבולות האלה) יוצגו רק אם הן זולות משמעותית
  flex_min: 3
  flex_max: 5
  flex_min_saving_pct: 15   # כמה אחוז זול יותר מההצעה הטובה ביותר בתוך הטווח

# שבת וחגים (הזמנים מ-Hebcal לפי מיקום כל שדה תעופה)
shabbat:
  # כמה שעות לפני הדלקת נרות הטיסה חייבת לנחות (ביעד, או בארץ בחזור)
  arrive_before_candles_hours: 3
  # כמה שעות אחרי צאת שבת/חג מותר שהטיסה תמריא (זמן להגיע לשדה ולעבור בידוק)
  depart_after_havdalah_hours: 3.5
  # בחו"ל: לחסום גם את יום טוב שני של גלויות
  diaspora_yomtov_abroad: true
  candle_minutes_israel: 20
  candle_minutes_abroad: 18

# מחיר לאדם (מבוגר אחד), במטבע:
currency: ILS
# כמה נוסעים במשפחה - רק לחישוב מחיר כולל משוער בתצוגה
family_size: 5

# ספקי נתונים. ספק פעיל רק אם יש לו מפתח במשתני הסביבה (SERPAPI_KEY / DUFFEL_TOKEN)
providers:
  serpapi:
    # תקציב אוטומטי: בכל ריצה המערכת בודקת ב-SerpApi כמה חיפושים נשארו עד החידוש
    # (בדיקה חינמית) ומחלקת אותם שווה בשווה בין הימים שנשארו. כך לא עוברים את המכסה
    # ומנצלים את כולה.
    auto_budget: true
    quota_reset_day: 23       # גיבוי, אם SerpApi לא מחזיר תאריך חידוש
    reserve: 3                # חיפושים שנשארים בצד לבדיקות ידניות
    # מתוך התקציב היומי: כמה בדיקות "מי המוכר" (אימות שהמחיר הוא של חברת התעופה)
    daily_verify_budget: 1
    # בשימוש רק כש-auto_budget כבוי, או אם בדיקת המכסה נכשלה
    daily_search_budget: 6
  duffel:
    # כל חיפוש ללא הזמנה עולה בערך 0.005$
    daily_search_budget: 100

# חברות שגוגל לא מציג כמוכרות ישירות, ולכן אי אפשר לאמת שהמחיר הוא המחיר שלהן.
# הטיסות שלהן מוצגות עם אזהרה "לבדוק באתר החברה", ולא מבזבזים עליהן בדיקות.
# חברה שנכשלת פעמיים בבדיקה מתווספת לרשימה אוטומטית.
unverifiable_airlines: [IZ]   # IZ = ארקיע

# הצגה
verify_top_trips_per_destination: 2
max_leg_age_days: 14        # טיסה שלא נבדקה יותר מזה לא תוצג
alternatives_per_destination: 6
